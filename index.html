<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Activity Tracking System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>User Activity Tracking System</h1>

    <section>
        <h2>Activity Analysis</h2>
        <div id="activityAnalysis"></div>
    </section>

    <section>
        <h2>Unusual Activity Detection</h2>
        <div id="unusualActivities"></div>
    </section>

    <section>
        <h2>User Activity Timeline</h2>
        <input type="number" id="userIdInput" placeholder="Enter User ID">
        <button id="timelineButton">Get Timeline</button>
        <div id="userTimeline"></div>
    </section>

    <section>
        <h2>Live Activity Simulation</h2>
        <button id="startSimulation">Start Simulation</button>
        <button id="stopSimulation">Stop Simulation</button>
        <div id="liveActivities"></div>
    </section>

    <section>
        <h2>Activity Summary</h2>
        <div id="activitySummary"></div>
    </section>
    <script src="script.js"></script>
</body>

</html>
